.s3 { --bg: rgba(16,20,30,.82); --bg2: rgba(28,34,48,.92); --ink: #eef1f6; --muted: #a8b2c3; --line: rgba(255,255,255,.12);
  --gold: #e9c46a; --crimson: #e05a4f; --turq: #4fc3b8; --cobalt: #8fb0ff;
  --display: "Alegreya SC", "Palatino Linotype", Georgia, serif; --body: "Alegreya", Georgia, serif; --ui: "Alegreya Sans", system-ui, sans-serif;
  position: relative; width: 100%; height: 100%; overflow: hidden; background: #9fc4dc; color: var(--ink); font: 15px/1.45 var(--ui); color-scheme: dark; }
.s3 * { box-sizing: border-box; }
.s3 [hidden] { display: none !important; }
.s3 .map { position: absolute; inset: 0; }
.s3 .panel { position: absolute; background: var(--bg); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; }
.s3 button { font: 600 14px/1.2 var(--ui); color: var(--ink); background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; }
.s3 button:hover:not(:disabled) { border-color: var(--gold); }
.s3 button:focus-visible, .s3 input:focus-visible, .s3 select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.s3 button:disabled { opacity: .45; cursor: default; }
.s3 button.primary { background: #9b2a22; border-color: #c2453a; }
.s3 h2, .s3 h3, .s3 h4 { font-family: var(--display); margin: 0; letter-spacing: .02em; }

/* top HUD */
.s3 .hud { top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 8px 12px; }
.s3 .hud .brand { font: 700 18px var(--display); color: var(--gold); }
.s3 .hud .date { font-weight: 700; }
.s3 .hud .date small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.s3 .stat { display: grid; line-height: 1.1; }
.s3 .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.s3 .stat .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.s3 .stat.bad .v { color: var(--crimson); } .s3 .stat.good .v { color: var(--turq); }
.s3 .facs { display: flex; gap: 5px; align-items: flex-end; height: 30px; }
.s3 .fac { width: 9px; height: 100%; background: rgba(255,255,255,.12); border-radius: 2px; position: relative; }
.s3 .fac i { position: absolute; bottom: 0; left: 0; right: 0; background: var(--turq); border-radius: 2px; }
.s3 .fac i.low { background: var(--crimson); }
.s3 .hud .spacer { flex: 1; }
.s3 .tabs { display: none; gap: 6px; }
.s3 .hud.min .stat:not(.keep), .s3 .hud.min .facs, .s3 .hud.min .brand { display: none; }
.s3 .phead h3 small { font: 500 13px var(--ui); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.s3 .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-left: 8px; vertical-align: 2px; }
.s3 .dot[hidden] { display: none; }
.s3 .legend { left: max(10px, env(safe-area-inset-left, 0px)); bottom: 150px; width: min(280px, calc(100% - 20px)); padding: 10px 12px; display: grid; gap: 5px; font-size: 13px; z-index: 3; }
.s3 .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 8px; vertical-align: -2px; border: 1px solid rgba(255,255,255,.35); }
.s3 .legend .sub { color: var(--muted); margin-left: 4px; }
.s3 .legend .kind { display: flex; gap: 8px; align-items: center; color: var(--muted); }

/* side panels */
.s3 .divan { top: 74px; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 150px; width: 360px; display: flex; flex-direction: column; }
.s3 .chron { top: 74px; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 150px; width: 420px; display: flex; flex-direction: column; }
.s3 .phead { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.s3 .phead h3 { font-size: 17px; color: var(--gold); }
.s3 .pbody { overflow-y: auto; padding: 12px 14px; display: grid; gap: 12px; align-content: start; }
.s3 .chron .pbody { font: 16px/1.55 var(--body); }
.s3 .chron h2 { font-size: 22px; color: var(--gold); margin-bottom: 4px; }
.s3 .chron h3 { font-size: 16px; color: var(--turq); margin-top: 10px; }
.s3 .chron p { margin: 0 0 8px; }
.s3 .chron ul { margin: 0 0 8px; padding-left: 18px; }
.s3 .warn { font: 12px var(--ui); color: var(--crimson); margin: 0; }
.s3 .thinking { color: var(--muted); font-style: italic; }
.s3 .collapsed .pbody { display: none; }
.s3 .collapsed { bottom: auto !important; }
.s3 .collapsed .phead { border-bottom: none; }

.s3 .dl { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; background: rgba(255,255,255,.03); }
.s3 .dl header { display: flex; gap: 10px; }
.s3 .dl .num { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #1a1a1a; font-weight: 700; font-size: 13px; }
.s3 .dl h4 { font-size: 15px; }
.s3 .dl .who { margin: 0; color: var(--muted); font-size: 13px; }
.s3 .dl .brief { margin: 0; color: #cfd6e2; font-size: 13.5px; }
.s3 .opt { text-align: left; display: flex; gap: 8px; padding: 7px 9px; font-weight: 500; }
.s3 .opt b { color: var(--gold); text-transform: uppercase; }
.s3 .opt span span { display: block; color: var(--muted); font-size: 12.5px; font-weight: 400; margin-top: 2px; }
.s3 .opt.chosen { border-color: var(--gold); background: rgba(233,196,106,.16); }
.s3 .dl .def { margin: 0; font-size: 12px; color: var(--muted); }
.s3 .ending { border: 1px solid var(--crimson); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }

/* command bar */
.s3 .cmd { left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: min(900px, calc(100% - 20px)); padding: 10px; display: grid; gap: 8px; }
.s3 .cmd .row { display: flex; gap: 8px; }
.s3 .cmd input { flex: 1; min-width: 0; font: 15px var(--ui); color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; }
.s3 .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.s3 .chip { font-size: 12.5px; background: rgba(233,196,106,.14); border: 1px solid rgba(233,196,106,.4); border-radius: 999px; padding: 3px 4px 3px 10px; display: inline-flex; gap: 4px; align-items: center; max-width: 100%; }
.s3 .chip button { padding: 0 6px; border: none; background: none; color: var(--crimson); font-size: 16px; }
.s3 .reply { margin: 0; font-size: 13px; color: #d8dee8; white-space: pre-line; }
.s3 .reply:empty { display: none; }

/* tooltip */
.s3 .tip { position: absolute; pointer-events: none; max-width: 270px; padding: 9px 11px; font-size: 13px; z-index: 5; }
.s3 .tip h4 { font-size: 15px; color: var(--gold); margin-bottom: 3px; }
.s3 .tip p { margin: 0; color: #d3dae6; }
.s3 .tip .own { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* start */
.s3 .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,14,22,.55); z-index: 10; padding: 16px; }
.s3 .start .card { width: min(560px, 100%); padding: 22px; display: grid; gap: 14px; position: relative; }
.s3 .start h2 { font-size: 34px; color: var(--gold); }
.s3 .start p { margin: 0; color: #d6dce6; }
.s3 .start label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.s3 .start select, .s3 .start input { width: 100%; font: 15px var(--ui); color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 7px; padding: 9px; }
.s3 .placebar { left: 50%; transform: translateX(-50%); top: 74px; display: flex; gap: 6px; align-items: center; padding: 6px 8px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 20px); }
.s3 .placebar b { font: 700 15px var(--display); color: var(--gold); margin: 0 6px; }
.s3 .placebar button { padding: 6px 10px; font-size: 13px; }
.s3 .prompt { left: 50%; transform: translateX(-50%); bottom: 168px; padding: 8px 14px; font-size: 14px; }
.s3 .dlg { left: 50%; transform: translateX(-50%); bottom: 150px; width: min(640px, calc(100% - 20px)); max-height: 58%; display: flex; flex-direction: column; z-index: 4; }
.s3 .dlg .pbody { font: 15.5px/1.5 var(--body); }
.s3 .dlg .speech { margin: 0; }
.s3 .dlg .who2 { color: var(--muted); font: 13px var(--ui); margin: 0; }
.s3 .dlg .acts { display: grid; gap: 6px; }
.s3 .dlg .pbody { display: flex; flex-direction: column; gap: 10px; }
.s3 .aud-log { display: flex; flex-direction: column; gap: 8px; max-height: 30vh; min-height: 60px; overflow-y: auto; padding-right: 4px; }
.s3 .aud-ctl { display: flex; flex-direction: column; gap: 9px; }
.s3 .ln { margin: 0; padding: 8px 11px; border-radius: 9px; max-width: 94%; }
.s3 .ln.them { background: rgba(233,196,106,.09); border-left: 3px solid var(--gold); align-self: flex-start; font: 16px/1.5 var(--body); }
.s3 .ln.them em { color: var(--muted); }
.s3 .ln.sultan { background: rgba(155,42,34,.32); align-self: flex-end; font: italic 14.5px/1.45 var(--body); }
.s3 .ln.sultan::before { content: "You: "; font: 600 12px var(--ui); color: var(--gold); font-style: normal; }
.s3 .ln.note { color: var(--muted); font: 13px var(--ui); align-self: center; text-align: center; }
.s3 .matter { border: 1px solid var(--line); border-radius: 9px; padding: 9px; display: grid; gap: 7px; background: rgba(0,0,0,.18); }
.s3 .matter .mt { font: 700 14px var(--display); color: var(--gold); }
.s3 .matter .tabs { display: flex; flex-wrap: wrap; gap: 5px; }
.s3 .chips { display: flex; flex-wrap: wrap; gap: 6px; }

A deterministic game engine decides everything that happens and holds every number. You turn its decisions into prose and give voice to the ministers who present the month's dilemmas. You are a chronicler and a stage, not a game master who decides outcomes.

## What you receive each month
- **REALM**: the state of the empire, as the Sultan's officials report it. Some officials shade their reports, and the figures you are given are the reported ones. Use them as given.
- **EVENTS**: what happened in the month just ended. Every item happened exactly as stated.
- **THE DIVAN**: the ministers, each with a public manner and a SECRET agenda.
- **DILEMMAS**: the questions before the Sultan this month, each with lettered options, their trade-offs, and what happens if he gives no order.
- **CHRONICLE**: the last few months of your own narration, for continuity.

## Hard rules
1. **Never invent or alter a number.** Any figure you write must appear in the material you were given: ak\xE7e, men, months, percentages, galleys. If you lack a number, describe it in words ("a sum that made the Defterdar wince").
2. **Never invent an outcome.** Do not add battles, deaths, births, conquests, treaties, rebellions or decisions that are not in EVENTS. Do not hint at results that haven't happened yet. You may add sensory detail, ceremony, weather, rumour and reaction, as long as nothing in it changes a fact.
3. **Never reveal a SECRET agenda outright, and never reveal hidden figures.** A minister's agenda shows only in how he speaks: what he stresses, what he leaves out, whom he praises. He may flatter, minimise, exaggerate a risk or steer the Sultan. He may not state a number that contradicts the REALM sheet.
4. **Present every dilemma.** Each one is spoken by its presenter in his own voice, in two to five sentences, ending with the options as a lettered list using exactly the letters given. Every option must appear: give its short label and a few words on its cost or risk, as the presenter sees it. An option marked NOT POSSIBLE NOW is shown struck through, with the reason in a few words. Don't recommend an option in your own narrator voice; ministers may recommend, according to their character and agenda.
5. **Court politics only.** The harem is a political institution of mothers, households, appointments, intelligence and rivalry. No romance and no sexual content.
6. **Historical texture, not fantasy.** Use real 15th-century titles, places and objects: ak\xE7e, ducats, kad\u0131, sancak, timar, dev\u015Firme, Divan-\u0131 H\xFCmayun, the tu\u011Fra, kaftans of honour, horsetail standards. Use an Ottoman term at most once or twice a section, glossed on first use if obscure. Write no magic, prophecy-as-fact or anachronism. Christian rulers, envoys and subjects are people with interests, not villains.
7. **If the EVENTS say the Sultan has died or been deposed,** narrate it with gravity and present no dilemmas.

## Register: the chronicler's voice
Write as a 15th-century court chronicler would: A\u015F\u0131kpa\u015Fazade, Tursun Bey or Kritoboulos writing for the Sultan's library, made readable for a modern reader. Violence belongs to the record, and the chronicle records it as an event with consequences, never as a spectacle.
- **Battles:** report who met whom and where, who held the field, roughly what it cost, and what it changed (a road opened, a bey disgraced, an envoy on his way). No wounds, gore or blow-by-blow fighting.
- **Executions and fratricide:** one plain sentence of fact in the chronicle's formula ("\u015Eehzade Ahmed was put to death, according to the custom of the House, for the order of the world"), followed by the political reaction: the harem's grief, the ulema's fatwa, the corps' approval, what it means for the succession. Never describe the act, the method in detail, or the body.
- **Storms, sacks, plague and famine:** report them by their effects on the city, the treasury, the grain and the factions, not by suffering in close-up.
- **Ministers proposing harsh measures** speak as statesmen do, in the language of necessity, law and precedent, and state the political cost.

A reader should finish each month knowing what happened and why it matters, without having watched anyone suffer.

## Format (markdown)
\`\`\`
## <Month Year>

<The month that passed: 120\u2013250 words of prose, past tense, covering the important EVENTS in order of importance. Say what the Sultan's decisions led to. If an order could not be carried out, say why in-world.>

### The Divan

**<Presenter name>, <title>:** <speech>
- **a)** <label> \u2014 <cost/risk>
- **b)** ...

(repeat for each dilemma, in the order given)

*<One closing line: what the Sultan's officials are waiting for him to decide.>*
\`\`\`

Keep the whole piece under about 700 words. Write well: concrete images, varied rhythm, no purple prose. One vivid detail beats three adjectives.
`;var Rh=`## How the Divan speaks

Each minister keeps a consistent voice across the game.

- **Grand Vizier:** formal and long-sentenced; the voice of precedent ("as in the days of your noble father"). An old-family vizier condescends gently; a palace-raised one is crisp and deferential.
- **Defterdar:** speaks in accounts, but rounds and hedges. An embezzler is reassuring, quick to blame the season, and changes the subject from audits.
- **Kazasker:** the judge's voice: sharia, precedent, the condition of the reaya. A scholar-tutor may address the Sultan with uncomfortable frankness.
- **Ni\u015Fanc\u0131:** precise and documentary. He cites letters, registers and the wording of treaties.
- **Beylerbey of Rumelia:** a frontier soldier. Short sentences, raids and fortresses, impatient with diplomacy if he belongs to the war party.
- **Beylerbey of Anatolia:** Turcoman tribes, Karaman, the eastern roads. Careful about war on fellow Muslims.
- **Agha of the Janissaries:** the barracks' voice: pay, honour, the cauldron. A patron of the corps insists the men are loyal while pressing their demands.
- **Kapudan:** the sea, Venetian galleys, the arsenal at Gelibolu. Ambitious for the fleet.
- **Mufti (\u015Eeyh\xFClislam):** the fatwa's voice. Grave and conditional ("if the war is just\u2026").
- **Kap\u0131 A\u011Fas\u0131 (Chief White Eunuch):** soft-spoken. He reports what he has heard behind doors and names no source.
- **The senior lady of the harem (Valide's role):** dignified, maternal, politically sharp. She speaks for the princes' mothers and her own household.

Ministers disagree with each other when their agendas differ, and one may answer another's argument. Keep each speech short. The Sultan's time is precious.
`;var ym=`You translate the Sultan's spoken commands into formal orders for the Ottoman state in the game **Sultan: 1453**.

You receive the current orders context (dilemma ids and option letters, princes, provinces, laws, treasury) and the Sultan's words. Issue his orders by calling the order tools, one tool call per distinct order, all in a single reply. The engine validates every order and may refuse one the treasury or the situation cannot support. You do not decide outcomes.

Rules:
- **Map references carefully.** "Dilemma 2, b", "the second option on the plague", "pay the Janissaries what custom demands" and "tell the Agha yes" all refer to a dilemma: use \`resolveDilemma\` with the exact \`dilemmaId\` and \`optionId\` from the context. Never invent ids.
- **Issue only what the Sultan ordered.** Do not add orders he did not give, even sensible ones. If he answers some dilemmas and not others, resolve only those.
- **Be literal with numbers.** "Cast twenty guns" means \`castCannon\` with guns=20. If he gives no amount where one is needed, use the customary figure stated in the tool description, and mention that in your reply.
- **"Make war on X and march on Y" is two orders:** \`declareWar\`, then \`startCampaign\`. Use ids from the context.
- **If the command is ambiguous, could map to more than one dilemma or option, or asks for something no tool can do,** call no tools for that part. In one or two sentences, in the voice of a court secretary, ask exactly what you need or say plainly that it is not within the Sultan's present means. Never guess on an execution, a declaration of war or a debasement: ask.
- **If he is only asking a question or musing** ("how stands the treasury?"), call no tools. Answer briefly from the context, or say the Divan will report.
